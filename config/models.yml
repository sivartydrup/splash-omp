providers:
# One splash server serves exactly ONE model (the --model / SPLASH_M1_MODEL of
# the running `splash serve`). A request whose "model" field names a different
# model gets a 404 — even if that model is listed here.
#
# This catalog lists the models you can serve on this port. To serve a
# different one, start omp with a different model:
#   SPLASH_M1_MODEL=unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M omp
# and point your modelRoles at it. See README "Serving a different model".
  splash-m1:
    baseUrl: http://127.0.0.1:8000/v1
    api: openai-completions
    auth: none
    models:
    - id: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M
      name: Splash Qwen3.8 27B (local)
      reasoning: true
      thinking:
        mode: effort
        efforts:
        - minimal
        - low
        - medium
        - high
        requiresEffort: false
      input:
      - text
      - image
      supportsTools: true
      contextWindow: 262144
      maxTokens: 32768
      cost:
        input: 0
        output: 0
        cacheRead: 0
        cacheWrite: 0
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: true
        thinkingFormat: qwen-chat-template
        qwenTemplateReasoningEffort: true
        maxTokensField: max_tokens
